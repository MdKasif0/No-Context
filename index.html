<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romantic Sunset Animation — Fullscreen 1:1 Cinematic Experience</title>
  <meta name="description" content="A 1:1 procedural hand-drawn anime animation recreating sunset romance scene in 720x720 vector artwork with synchronized sound.">
  <link rel="stylesheet" href="styles/main.css?v=v25">
</head>
<body>
  <div class="app-container">
    <!-- Fullscreen 1:1 Stage Viewport -->
    <main class="stage-wrapper">
      <div class="stage-viewport" id="stage-container" title="Click to Play/Pause • Double-click or Press 'F' for Fullscreen">
        <!-- Procedural Layered SVG Artwork -->
        <svg id="scene-svg" viewBox="0 0 720 720" width="720" height="720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
          <!-- Dynamic layers injected via src/scene.js -->
        </svg>

        <!-- Procedural Film Grain & Paper Tooth Canvas -->
        <canvas id="grain-canvas" width="720" height="720"></canvas>

        <!-- Soft Paper Tint Vignette Overlay -->
        <div class="paper-tint-overlay"></div>
      </div>
    </main>

    <!-- Synchronized Soundtrack with Audio ON by Default -->
    <audio id="scene-audio" src="audio.mp3" preload="auto" loop></audio>

    <!-- Floating Audio Enable Prompt (Only visible if browser blocks unmuted autoplay) -->
    <div id="sound-prompt" class="sound-prompt" style="display: none;">
      <span style="font-size: 16px;">🔊</span>
      <span>Tap anywhere to enable sound</span>
    </div>
  </div>

  <!-- Main Application Bootstrap -->
  <script type="module">
    import { SceneCompositor } from './src/scene.js?v=v25';

    window.addEventListener('DOMContentLoaded', () => {
      const audioEl = document.getElementById('scene-audio');
      const soundPrompt = document.getElementById('sound-prompt');
      const stageContainer = document.getElementById('stage-container');

      // 1. Configure audio ON by default
      audioEl.muted = false;
      audioEl.volume = 1.0;

      // 2. Initialize Scene Compositor & Deterministic Engine
      const compositor = new SceneCompositor({
        audioElement: audioEl
      });
      const engine = compositor.engine;
      const camera = compositor.camera;

      window.sceneCompositor = compositor;
      window.engine = engine;
      window.camera = camera;

      // 3. Attempt unmuted audio autoplay
      let soundUnlocked = false;

      const startAudio = () => {
        audioEl.muted = false;
        audioEl.volume = 1.0;
        audioEl.currentTime = engine.currentTime;
        return audioEl.play();
      };

      // 4. One-time interaction handler to unlock sound if initially restricted
      const unlockAudio = (e) => {
        if (soundUnlocked) return;
        soundUnlocked = true;

        if (e) {
          e.stopPropagation();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }

        window.removeEventListener('click', unlockAudio, true);
        window.removeEventListener('touchstart', unlockAudio, true);
        window.removeEventListener('keydown', unlockAudio, true);

        startAudio()
          .then(() => {
            if (soundPrompt) {
              soundPrompt.style.opacity = '0';
              setTimeout(() => { soundPrompt.style.display = 'none'; }, 400);
            }
          })
          .catch((err) => {
            console.warn('Audio playback error:', err);
          });

        // Ensure engine is and remains playing continuously without interruption
        if (!engine.isPlaying) {
          engine.play();
        }
      };

      // Try unmuted autoplay immediately on load
      startAudio()
        .then(() => {
          soundUnlocked = true;
          if (soundPrompt) soundPrompt.style.display = 'none';
        })
        .catch(() => {
          // Browser autoplay policy blocked unmuted sound; listen in capture phase to unlock on first interaction
          if (soundPrompt) soundPrompt.style.display = 'flex';
          window.addEventListener('click', unlockAudio, true);
          window.addEventListener('touchstart', unlockAudio, { capture: true, passive: false });
          window.addEventListener('keydown', unlockAudio, true);
        });

      if (soundPrompt) {
        soundPrompt.addEventListener('click', (e) => {
          e.stopPropagation();
          unlockAudio(e);
        });
      }

      // 5. Stage click: Toggle Play / Pause (Only after sound is unlocked, never on the unlock tap)
      stageContainer.addEventListener('click', (e) => {
        if (!soundUnlocked) return;
        // Toggle play/pause
        engine.togglePlay();
      });

      // 6. Double click or 'F' key: Toggle native OS Fullscreen
      const toggleFullScreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      };

      stageContainer.addEventListener('dblclick', toggleFullScreen);

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          engine.togglePlay();
        } else if (e.code === 'KeyF') {
          e.preventDefault();
          toggleFullScreen();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          audioEl.muted = !audioEl.muted;
        }
      });

      // 7. Auto-hide mouse cursor after 2.5 seconds of inactivity
      let idleTimer = null;
      window.addEventListener('mousemove', () => {
        document.body.classList.remove('cursor-hidden');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (engine.isPlaying) {
            document.body.classList.add('cursor-hidden');
          }
        }, 2500);
      });

      // 8. Start animation engine automatically
      engine.play();
    });
  </script>
</body>
</html>
